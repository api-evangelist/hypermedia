features:
- name: HATEOAS Navigation
  description: Hypermedia APIs include in-response links and link relations so clients
    can discover available state transitions at runtime rather than hard-coding URI
    templates against documentation.
- name: Standardized Hypermedia Formats
  description: Established formats such as HAL, JSON:API, Siren, Collection+JSON,
    Hydra, ALPS, UBER, Mason, and Verbose provide structured ways to embed links,
    actions, and metadata inside API responses.
- name: Web Linking via Link Headers
  description: RFC 5988 and RFC 8288 define the HTTP Link header and the Web Linking
    model, including the IANA Link Relations registry that gives shared meaning to
    rel values across APIs.
- name: Linked Data and Semantic Hypermedia
  description: JSON-LD, Hydra, schema.org, and the broader RDF stack extend hypermedia
    with shared vocabularies, enabling semantic interoperability between APIs, search
    engines, and knowledge graphs.
- name: Self-Describing API Catalogs
  description: RFC 9264 api-catalog, APIs.json, and similar discovery documents act
    as hypermedia entry points that link a host to its APIs, OpenAPI specs, terms
    of service, and policies.
- name: Hypermedia Frameworks and Libraries
  description: Frameworks like Spring HATEOAS, Spring Data REST, and Apicurio provide
    implementation support for emitting HAL, HAL-FORMS, JSON:API, and Collection+JSON
    responses from server code.
use_cases:
- name: Evolvable Long-Lived APIs
  description: HATEOAS-based APIs allow servers to evolve URI structures, add new
    affordances, and deprecate endpoints over time while clients continue to navigate
    by link relations rather than hard-coded paths.
- name: Domain-Driven Project Management APIs
  description: OpenProject exposes work packages, projects, users, and attachments
    through a HAL+JSON hypermedia API where every resource embeds links to related
    resources and available actions.
- name: Standardized CRUD via JSON:API
  description: Patreon, MBTA, Teamtailor, and Drupal expose their resources via JSON:API,
    providing a consistent specification for fetching, including related resources,
    filtering, sorting, and pagination across very different domains.
- name: Semantic Search and Structured Data
  description: Schema.org and JSON-LD allow APIs and websites to publish machine-readable
    Linked Data that search engines, agents, and aggregators can consume without bespoke
    parsers.
- name: API Discovery and Catalogs
  description: APIs.json and RFC 9264 api-catalog documents act as hypermedia entry
    points that let crawlers, tooling, and AI agents discover an organization's APIs,
    specifications, and policies from a single well-known URL.
- name: Hypermedia-Driven Web Apps
  description: Approaches like htmx, hyperview, and Hypermedia Systems return HTML
    fragments and hypermedia controls directly to the client, simplifying applications
    by treating HTML itself as the hypermedia format.
integrations:
- name: HAL (Hypertext Application Language)
  description: A minimal hypermedia format for JSON and XML that embeds _links and
    _embedded resources, widely used by APIs such as OpenProject, Reverb, and Spring
    Data REST.
- name: JSON:API
  description: A specification for building APIs in JSON that standardizes resource
    objects, relationships, includes, filtering, sorting, and pagination, used by
    Patreon, MBTA, Teamtailor, and Drupal.
- name: Siren
  description: A hypermedia specification for representing entities, their classes,
    properties, actions, and links, designed for rich, action-oriented hypermedia
    clients.
- name: Collection+JSON
  description: A JSON-based hypermedia format from Mike Amundsen for representing
    collections of items with queries and templates for write operations.
- name: JSON-LD and Hydra
  description: JSON-LD provides a JSON syntax for Linked Data; Hydra extends it with
    a vocabulary for describing hypermedia-driven Web APIs including operations, classes,
    and supported properties.
- name: ALPS (Application-Level Profile Semantics)
  description: A profile description format for documenting semantic descriptors and
    state transitions independent of any single media type.
- name: Web Linking (RFC 5988 / RFC 8288)
  description: IETF specifications defining the HTTP Link header and a model for typed
    web links, along with the IANA Link Relations registry shared across hypermedia
    formats.
- name: Spring HATEOAS
  description: A library for building hypermedia-driven REST APIs in Spring, supporting
    HAL, HAL-FORMS, Collection+JSON, and UBER, with first-class integration into Spring
    Data REST.
